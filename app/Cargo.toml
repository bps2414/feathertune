[package]
name = "feathertune"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
toml = "1"
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }

# Build speed: see AGENTS.md. Debug info for dependencies is never needed and PDB generation is
# a large part of a Windows link.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Day-to-day optimized build (measurements): incremental, no LTO, so a one-file change relinks in
# seconds. The page runs in WebView2, so this changes nothing measurable in RAM or CPU.
[profile.release]
incremental = true
strip = true

# Shipping build (installer): `cargo build --profile dist`. Slow, only for releases.
[profile.dist]
inherits = "release"
incremental = false
lto = "thin"
codegen-units = 1

[features]
# Production build without the Tauri CLI (the CLI would pass this itself).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
