name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts never get reused on a fresh runner and only bloat the cache.
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The phone remote (mobile/): typecheck, lint and tests (the Noise vectors among them), only when it changed.
  mobile-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  mobile:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Fully optimized exe and the NSIS installer (Tauri CLI, `--profile dist`), downloadable from the
  # run page. Not on pull requests. The CLI version matches the `tauri` crate in Cargo.lock. On a `v*`
  # tag it also publishes a GitHub release with the installer (the tag must match the app version), its
  # notes taken from that version's section of CHANGELOG.md.
  dist:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: dist
      # The release's own Last.fm API keys and Discord application id (lastfm.rs, discord.rs read them
      # with option_env!). Empty in forks, where the build works as before: they go in config.toml.
      - run: npx --yes @tauri-apps/cli@2.12.3 build -- --profile dist --locked
        env:
          FEATHERTUNE_LASTFM_API_KEY: ${{ secrets.FEATHERTUNE_LASTFM_API_KEY }}
          FEATHERTUNE_LASTFM_API_SECRET: ${{ secrets.FEATHERTUNE_LASTFM_API_SECRET }}
          FEATHERTUNE_DISCORD_CLIENT_ID: ${{ secrets.FEATHERTUNE_DISCORD_CLIENT_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: feathertune-${{ github.sha }}
          path: |
            app/target/dist/feathertune.exe
            app/target/dist/bundle/nsis/*-setup.exe
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then echo "tag $TAG does not match version $version"; exit 1; fi
          awk -v v="$version" '/^## /{on = ($2 == v); next} on' ../CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "no CHANGELOG.md section for $version"; exit 1; fi
          gh release create "$TAG" target/dist/bundle/nsis/*-setup.exe --title "feathertune $version" --notes-file notes.md

  # The phone remote's Android APK, attached to the release that `dist` created (only on a `v*` tag). Signed
  # with the debug key of Expo's template, the one every earlier APK used, so a new one installs over the old;
  # the hash check stops the job if the template ever ships another key.
  android:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec expo prebuild --platform android --clean --no-install
      - run: echo "221e0a3106aa4c3ccc154e0a418b55020b3f9ea6e84f92e8749cd9e2f39f5e58  android/app/debug.keystore" | sha256sum -c -
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          cp android/app/build/outputs/apk/release/app-release.apk "feathertune-remote-$version.apk"
          gh release upload "$TAG" "feathertune-remote-$version.apk" --clobber
