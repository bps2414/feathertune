name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts never get reused on a fresh runner and only bloat the cache.
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The example extensions: every manifest is JSON with the required fields, and the Rust SDK builds the
  # WebAssembly example.
  extensions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/extensions
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: |
          for m in */plugin.json; do
            jq -e '(.id | test("^[a-z0-9_-]+(\\.[a-z0-9_-]+)+$")) and (.name | length > 0) and (.version | length > 0) and .api == 1' "$m" > /dev/null || { echo "invalid $m"; exit 1; }
          done
      - run: cargo build --release --locked --target wasm32-unknown-unknown
        working-directory: examples/extensions/track-counter

  # The phone remote (mobile/): typecheck, lint and tests (the Noise vectors among them), only when it changed.
  mobile-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  mobile:
    needs: mobile-changes
    if: needs.mobile-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Fully optimized exe and the NSIS installer (Tauri CLI, `--profile dist`), downloadable from the
  # run page. Not on pull requests. The CLI version matches the `tauri` crate in Cargo.lock. It builds
  # alongside `check`; `release` publishes only once both passed.
  dist:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: dist
      # The release's own Last.fm API keys and Discord application id (lastfm.rs, discord.rs read them
      # with option_env!). Empty in forks, where the build works as before: they go in config.toml.
      - run: npx --yes @tauri-apps/cli@2.12.3 build -- --profile dist --locked
        env:
          FEATHERTUNE_LASTFM_API_KEY: ${{ secrets.FEATHERTUNE_LASTFM_API_KEY }}
          FEATHERTUNE_LASTFM_API_SECRET: ${{ secrets.FEATHERTUNE_LASTFM_API_SECRET }}
          FEATHERTUNE_DISCORD_CLIENT_ID: ${{ secrets.FEATHERTUNE_DISCORD_CLIENT_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: feathertune-${{ github.sha }}
          path: |
            app/target/dist/feathertune.exe
            app/target/dist/bundle/nsis/*-setup.exe
          retention-days: 14

  # On a `v*` tag, once `check` and `dist` passed: the GitHub release with the installer (the tag must
  # match the app version), its notes taken from that version's section of CHANGELOG.md.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: feathertune-${{ github.sha }}
          path: app/out
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then echo "tag $TAG does not match version $version"; exit 1; fi
          awk -v v="$version" '/^## /{on = ($2 == v); next} on' ../CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "no CHANGELOG.md section for $version"; exit 1; fi
          gh release create "$TAG" out/bundle/nsis/*-setup.exe --title "feathertune $version" --notes-file notes.md

  # The phone remote's Android APK, attached to the release that `release` creates (only on a `v*` tag). It
  # builds alongside `dist` and waits for the release only to upload. When mobile/ did not change since the
  # previous tag, the previous release's APK is attached again instead of building it (the build is the
  # longest job). arm64-v8a only (every current phone): the native code builds once instead of four times. The
  # Gradle cache is written on tags too, since this job never runs on main. Signed with the debug key of Expo's
  # template, the one every earlier APK used, so a new one installs over the old; the hash check stops the job
  # if the template ever ships another key.
  android:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          if [ -n "$prev" ] && git diff --quiet "$prev" HEAD -- . \
            && gh release download "$prev" --pattern 'feathertune-remote-*.apk' --dir prev; then
            echo "apk=$(ls prev/*.apk)" >> "$GITHUB_OUTPUT"
            echo "mobile/ unchanged since $prev: reusing its APK"
          fi
      - if: steps.reuse.outputs.apk == ''
        uses: pnpm/action-setup@v6
        with:
          version: 12
      - if: steps.reuse.outputs.apk == ''
        uses: actions/setup-node@v7
        with:
          node-version-file: mobile/.nvmrc
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - if: steps.reuse.outputs.apk == ''
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - if: steps.reuse.outputs.apk == ''
        run: pnpm install --frozen-lockfile
      - if: steps.reuse.outputs.apk == ''
        run: pnpm exec expo prebuild --platform android --clean --no-install
      - if: steps.reuse.outputs.apk == ''
        run: echo "221e0a3106aa4c3ccc154e0a418b55020b3f9ea6e84f92e8749cd9e2f39f5e58  android/app/debug.keystore" | sha256sum -c -
      - if: steps.reuse.outputs.apk == ''
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      - if: steps.reuse.outputs.apk == ''
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --build-cache --parallel
        working-directory: mobile/android
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REUSED: ${{ steps.reuse.outputs.apk }}
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if [ -n "$REUSED" ]; then cp "$REUSED" "feathertune-remote-$version.apk"
          else cp android/app/build/outputs/apk/release/app-release.apk "feathertune-remote-$version.apk"; fi
          # `release` creates the release; wait for it (up to 40 minutes).
          for i in $(seq 120); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" "feathertune-remote-$version.apk" --clobber
