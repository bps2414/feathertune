name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts never get reused on a fresh runner and only bloat the cache.
  CARGO_INCREMENTAL: 0

defaults:
  run:
    working-directory: app

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Fully optimized exe and the NSIS installer (Tauri CLI, `--profile dist`), downloadable from the
  # run page. Not on pull requests. The CLI version matches the `tauri` crate in Cargo.lock. On a `v*`
  # tag it also publishes a GitHub release with the installer (the tag must match the app version).
  dist:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: dist
      # The release's own Last.fm API keys (lastfm.rs reads them with option_env!). Empty in forks,
      # where the build works as before: keys go in config.toml.
      - run: npx --yes @tauri-apps/cli@2.12.3 build -- --profile dist --locked
        env:
          FEATHERTUNE_LASTFM_API_KEY: ${{ secrets.FEATHERTUNE_LASTFM_API_KEY }}
          FEATHERTUNE_LASTFM_API_SECRET: ${{ secrets.FEATHERTUNE_LASTFM_API_SECRET }}
      - uses: actions/upload-artifact@v7
        with:
          name: feathertune-${{ github.sha }}
          path: |
            app/target/dist/feathertune.exe
            app/target/dist/bundle/nsis/*-setup.exe
          retention-days: 14
      - if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then echo "tag $TAG does not match version $version"; exit 1; fi
          gh release create "$TAG" target/dist/bundle/nsis/*-setup.exe --title "feathertune $version" --generate-notes
